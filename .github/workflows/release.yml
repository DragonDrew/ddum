name: release

# Pushing a tag vX.Y.Z builds both images for both architectures, pushes them to
# GHCR with an SBOM and provenance, signs them, and writes the GitHub release
# from the matching section of CHANGELOG.md. To check a signature:
#
#   cosign verify ghcr.io/dragondrew/ddum-bot:<version> \
#     --certificate-identity-regexp 'https://github.com/DragonDrew/ddum/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'DragonDrew/ddum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make e2e

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the images
      id-token: write # keyless signing
      attestations: write
    strategy:
      matrix:
        image: [bot, agent]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/dragondrew/ddum-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/dragondrew/ddum-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.title=ddum-${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - run: cosign sign --yes "ghcr.io/dragondrew/ddum-${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Write the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file notes.md --prerelease
